---
jellyfin_server:
  url: http://jellyfin.jealwh.local
  user: white
  # Optional: limit total adds + removes per collection per run
  # add_remove_limit: 100

collections:
  # Episodes truly never watched (no resume position saved)
  TV Shows - Never Watched:
    query: WHERE Played = false AND PlaybackPositionTicks = 0
    from: TV Shows

  # Episodes that have been watched to completion (90%+)
  TV Shows - Played:
    query: WHERE Played = true
    from: TV Shows

  # Episodes started but not finished (has resume position)
  TV Shows - In Progress:
    query: WHERE Played = false AND PlaybackPositionTicks > 0
    from: TV Shows

  # Never-watched Taskmaster (UK, NZ, AU, ...) episodes
  # Use OR for shows with localized names (Stormester, Suurmestari, etc.)
  Taskmaster - Never Watched:
    query: >
      WHERE Played = false AND PlaybackPositionTicks = 0 AND (
        SeriesName LIKE "Taskmaster" OR
        SeriesName LIKE "Stormester" OR
        SeriesName LIKE "Suurmestari" OR
        SeriesName LIKE "Le Maître du Jeu" OR
        SeriesName LIKE "The Brightest Light" OR
        SeriesName LIKE "Kongen befaler"
      )
    from: TV Shows

  # Simpsons episodes of the 1990s
  Simpsons - 90s Episodes:
    query: WHERE SeriesName LIKE "Simpsons" AND ProductionYear > 1989 AND ProductionYear < 2000
    from: TV Shows

  # Movies never watched, newer than 1940
  Movies - Never Watched, newer than 1940:
    query: WHERE Played = false AND PlaybackPositionTicks = 0 AND ProductionYear > 1940
    from: Movies

  # Old movies never watched
  Movies - Never Watched, older than 1940:
    query: WHERE Played = false AND PlaybackPositionTicks = 0 AND ProductionYear < 1940
    from: Movies
